<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600">
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6f2fc"/><stop offset=".55" stop-color="#e7def6"/><stop offset="1" stop-color="#d6c8ee"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" x2="1"><stop offset="0" stop-color="#c9a24f"/><stop offset=".5" stop-color="#ecd28f"/><stop offset="1" stop-color="#b98f3c"/></linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#9b87c9" stop-opacity=".45"/><stop offset="1" stop-color="#9b87c9" stop-opacity="0"/></linearGradient>
    <filter id="sombra" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#5f4c94" flood-opacity=".22"/></filter>
    <style>
      .linea{stroke-dasharray:620;stroke-dashoffset:620;animation:dibuja 2.6s ease-out .4s forwards}
      .area{opacity:0;animation:aparece 1s ease 2.4s forwards}
      .punto{transform-box:fill-box;transform-origin:center;animation:late 1.6s ease-in-out 2.8s infinite;opacity:0}
      .titila{animation:titila 2.4s ease-in-out infinite}
      .titila.b{animation-delay:1.1s}
      @keyframes dibuja{to{stroke-dashoffset:0}}
      @keyframes aparece{to{opacity:1}}
      @keyframes late{0%{opacity:1;transform:scale(1)}50%{opacity:1;transform:scale(1.5)}100%{opacity:1;transform:scale(1)}}
      @keyframes titila{0%,100%{opacity:.2}50%{opacity:1}}
    </style>
  </defs>
  <rect width="800" height="600" fill="url(#fondo)"/>
  <circle cx="660" cy="110" r="150" fill="#ffffff" opacity=".35"/>
  <circle cx="110" cy="520" r="120" fill="#ffffff" opacity=".3"/>

  <!-- título -->
  <text x="400" y="92" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="17" letter-spacing="5" fill="#5f4c94" font-weight="500">ROMI MANIFIESTA</text>
  <text x="400" y="160" text-anchor="middle" font-family="Cormorant Garamond, Georgia, serif" font-size="70" font-weight="700" fill="#2e2a38">De 0 a <tspan fill="#5f4c94">100</tspan> por día</text>

  <!-- computadora -->
  <g filter="url(#sombra)">
    <rect x="190" y="200" width="420" height="262" rx="18" fill="#2e2a38"/>
    <rect x="204" y="214" width="392" height="234" rx="8" fill="#ffffff"/>
    <path d="M150 470h500l-24 26a18 18 0 0 1-13 6H187a18 18 0 0 1-13-6z" fill="#e9e3f4" stroke="#cbbbe8" stroke-width="2"/>
    <rect x="360" y="472" width="80" height="7" rx="3.5" fill="#cbbbe8"/>
  </g>
  <!-- pantalla: gráfico -->
  <g font-family="Poppins, Arial, sans-serif">
    <text x="226" y="244" font-size="13" fill="#6f6a7c">Ganancia por día</text>
    <g stroke="#ece6f7" stroke-width="1.5"><path d="M226 300h350M226 350h350M226 400h350"/></g>
    <text x="574" y="292" text-anchor="end" font-size="12" fill="#9b87c9">100</text>
    <text x="574" y="420" text-anchor="end" font-size="12" fill="#9b87c9">0</text>
    <path class="area" d="M230 424 C 290 418, 320 404, 360 392 S 430 368, 470 340 S 530 300, 560 270 L560 430 L230 430 Z" fill="url(#area)"/>
    <path class="linea" d="M230 424 C 290 418, 320 404, 360 392 S 430 368, 470 340 S 530 300, 560 270" fill="none" stroke="#5f4c94" stroke-width="5" stroke-linecap="round"/>
    <circle class="punto" cx="560" cy="270" r="9" fill="url(#oro)" stroke="#ffffff" stroke-width="3"/>
  </g>

  <!-- etiqueta -->
  <rect x="268" y="530" width="264" height="40" rx="20" fill="#5f4c94"/>
  <text x="400" y="556" text-anchor="middle" font-family="Poppins, Arial, sans-serif" font-size="15" fill="#ffffff" font-weight="500">La guía + el kit para tu Claude</text>

  <!-- brillos -->
  <path class="titila" d="M110 120l6 16 16 6-16 6-6 16-6-16-16-6 16-6z" fill="url(#oro)"/>
  <path class="titila b" d="M690 300l4 11 11 4-11 4-4 11-4-11-11-4 11-4z" fill="#9b87c9"/>
  <path class="titila b" d="M120 330l4 10 10 4-10 4-4 10-4-10-10-4 10-4z" fill="#e7a6bf"/>
  <path class="titila" d="M700 470l5 13 13 5-13 5-5 13-5-13-13-5 13-5z" fill="url(#oro)"/>
</svg>
